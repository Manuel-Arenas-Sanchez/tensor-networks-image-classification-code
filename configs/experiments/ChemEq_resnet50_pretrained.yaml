name: ChemEq_resnet50_pretrained
seed: 24
device: auto

# Mismo pipeline de datos que la Tensor Network: mismos crops, mismas particiones
# train/valid/test, mismas clases y mismas métricas. Solo cambia el modelo.
data:
  dataset: lab_apparatus_crop
  data_dir: ChemistryLabApparatus-25
  batch_size: 16
  num_workers: 4
  smoke_samples:
  download: false
  image_size: 224
  crop_margin: 0.10
  preserve_aspect_ratio: true

model:
  # embedding_name / local_dim / bond_dim son placeholders: el factory los ignora
  # cuando layer_name == resnet50.
  embedding_name: none
  layer_name: resnet50
  input_shape: [3, 224, 224]
  local_dim: 1
  bond_dim: 1
  n_classes: 25

  # ResNet50 con pesos ImageNet (fine-tuning): baseline fuerte estándar de visión.
  pretrained: true
  freeze_backbone: false
  head_dropout: 0.0

training:
  # 120 épocas para todos los experimentos (comparación justa). El early-stopping
  # permite que el preentrenado pare antes y se justifique como "convergió en N < 120".
  epochs: 120
  learning_rate: 0.0003
  weight_decay: 0.0005
  log_every_n_steps: 100

  warmup_name: linear
  warmup_epochs: 3
  warmup_start_factor: 0.2

  label_smoothing: 0.0

  scheduler_name: reduce_on_plateau
  scheduler_factor: 0.5
  scheduler_patience: 4
  scheduler_min_lr: 0.000001

  early_stopping_patience: 12
  early_stopping_metric: eval_loss
  early_stopping_min_delta: 0.0

io:
  root_dir: runs
  checkpoint_name: best.pt
  metrics_name: metrics.csv
